# Create the application.yml file with the following content
# and fill out the placeholders with your secrets

spring:
  application:
    name: fotolyrik_backend

  servlet:
    multipart:
      max-file-size: 20MB  # Maximum size allowed per individual file
      max-request-size: 500MB  # Maximum size allowed for the entire request (all files + form data)

  datasource:
    url: jdbc:postgresql://localhost:5432/ #database_name
    username: #db_user
    password: #db_password

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
      enabled: true
      # Keep disabled by default. Enable only while adopting a known legacy
      # database that has no Flyway history, then disable it again.
      baseline-on-migrate: true
      baseline-version: 1
      clean-disabled: true
      default-schema: public
      locations: classpath:db/migration
      schemas: public
      validate-migration-naming: true
      validate-on-migrate: true

  sql:
    init:
      mode: always

  mail:
    host: #host
    port: #port
    username: #email_username
    password: #email_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  compression:
    mime-types: application/json
    min-response-size: 1024

config:
  files:
    upload-dir: /uploads

