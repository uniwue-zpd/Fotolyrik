services:
  frontend:
    environment:
      - NUXT_API_BASE_URL=${NUXT_API_BASE_URL}
    build:
      context: ./fotolyrik_frontend
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./fotolyrik_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - ${WORKSPACE:?error}/uploads:/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: always

  database:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      # In case you have a database dump, uncomment the following line and change the file name
      # - ./<your_dump>.sql:/docker-entrypoint-initdb.d/<your_dump>.sql
      - ${WORKSPACE:?error}/db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: always

  db_backup:
    build:
      context: ./db_backup
    environment:
      - DB_HOST=database # Host is the service name of the database container
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ${BACKUPS:?error}:/backups
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine-slim
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd
    ports:
      - "${PORT_NGINX:-80}:80"
    depends_on:
      - frontend
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_PROXY=edge
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_RELATIVE_PATH=/auth
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: always

  keycloak-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ${WORKSPACE:?error}/keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "keycloak" ]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: always
